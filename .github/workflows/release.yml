name: Build and Publish Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish production release? (Uncheck for compilation dry-run)'
        required: true
        type: boolean
        default: true
      target_platform:
        description: 'Which platform matrix do you want to run?'
        type: choice
        required: true
        default: all
        options:
          - all
          - macos-latest
          - ubuntu-22.04
          - windows-latest

permissions:
  contents: write

jobs:
  release:
    name: Build Sonixy on ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: >-
          ${{ github.event_name == 'workflow_dispatch' && inputs.target_platform != 'all'
              && fromJSON(format('["{0}"]', inputs.target_platform))
              || fromJSON('["macos-latest", "ubuntu-22.04", "windows-latest"]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev patchelf

      - name: Import Windows code signing certificate
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            Write-Host "WINDOWS_CERTIFICATE not set; Windows build will be unsigned."
            exit 0
          }
          New-Item -ItemType Directory -Path certificate -Force | Out-Null
          Set-Content -Path certificate/tempCert.txt -Value $env:WINDOWS_CERTIFICATE
          certutil -decode certificate/tempCert.txt certificate/certificate.pfx
          Remove-Item -Path certificate/tempCert.txt
          $cert = Import-PfxCertificate `
            -FilePath certificate/certificate.pfx `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText)
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV

      - name: Build Sonixy and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: pnpm tauri
          includeUpdaterJson: true
          updaterJsonKeepUniversal: true
          updaterJsonPreferNsis: true
          tagName: >-
            ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_release))
                && '__VERSION__' || '' }}
          releaseName: >-
            ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.create_release))
                && 'Sonixy v__VERSION__' || '' }}
          releaseBody: |
            See the assets below to download Sonixy v__VERSION__.

            ### Installation
            - **Windows**: `.msi` or `.exe` (NSIS) installer
            - **macOS**: `.dmg` (Apple Silicon + Intel universal build, unsigned — right-click → Open on first launch)
            - **Linux**: `.AppImage` or `.deb` package
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          uploadWorkflowArtifacts: ${{ github.event_name == 'workflow_dispatch' && inputs.create_release == false }}
          args: >-
            ${{ matrix.platform == 'macos-latest' && '--target universal-apple-darwin --config {"bundle":{"macOS":{"signingIdentity":"-"}}}' || '' }}
            ${{ matrix.platform == 'windows-latest' && env.WINDOWS_CERTIFICATE_THUMBPRINT != '' && format('--config {{"bundle":{{"windows":{{"certificateThumbprint":"{0}","digestAlgorithm":"sha256","timestampUrl":"http://timestamp.digicert.com"}}}}}}', env.WINDOWS_CERTIFICATE_THUMBPRINT) || '' }}
